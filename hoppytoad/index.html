<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Hoppy Toad</title>
<meta name="description" content="Hoppy Toad — a one-button jumping game. Hop the toad through the reeds." />
<meta name="theme-color" content="#0d4c96" />

<script>
/* Some hosts serve a folder's index page without its trailing slash —
   Vercel's cleanUrls does exactly that, turning /hoppytoad/ into /hoppytoad.
   At that URL every relative href below resolves against the SITE ROOT
   instead of this folder, so the stylesheet, the script and the sprites all
   404 and you get a page of unstyled text. Putting the base back here, before
   any of them is parsed, makes the game independent of how it is served.
   Skipped when the path already ends in a slash or names a file, so file://
   and normal /hoppytoad/ URLs are untouched. */
(function () {
  var p = location.pathname;
  if (p.charAt(p.length - 1) !== '/' && p.lastIndexOf('.') <= p.lastIndexOf('/')) {
    var b = document.createElement('base');
    b.href = p + '/';
    document.head.appendChild(b);
  }
})();
</script>

<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- The game never assumes it owns the page: everything lives inside this
     root, it is sized by its container, and it only claims the keyboard
     while it holds focus. -->
<div class="ht" id="ht" tabindex="0" aria-label="Hoppy Toad game">
  <div class="ht__stage" id="htStage">
    <canvas class="ht__canvas" id="htCanvas" width="400" height="600"
            aria-label="Game screen" role="img"></canvas>

    <!-- ─────────── menu ─────────── -->
    <div class="dlg dlg--menu" id="htMenu">
      <div class="dlg__bar">
        <img class="dlg__ico" src="assets/icon-32.png" alt="" />
        <span class="dlg__title">Hoppy Toad</span>
        <span class="dlg__btns"><i>_</i><i>□</i><b>✕</b></span>
      </div>
      <div class="dlg__body">
        <img class="dlg__badge" src="assets/icon-192.png" alt="Hoppy Toad" width="96" height="96" />
        <h1 class="dlg__h">HOPPY TOAD</h1>
        <p class="dlg__sub">He does not flap. He <b>jumps</b>.</p>
        <p class="dlg__hint">Click, tap or press <kbd>SPACE</kbd> to hop<br />
          <span class="dlg__hint2">Hop twice in the air to clear the tall reeds</span></p>
        <p class="dlg__best">Best score: <b id="htMenuBest">0</b></p>
        <button class="xpb xpb--go" id="htStart" type="button">Start Game</button>
      </div>
    </div>

    <!-- ─────────── game over ─────────── -->
    <div class="dlg dlg--over" id="htOver" hidden>
      <div class="dlg__bar dlg__bar--red">
        <span class="dlg__ico dlg__ico--x">✕</span>
        <span class="dlg__title">Game Over</span>
        <span class="dlg__btns"><i>_</i><i>□</i><b>✕</b></span>
      </div>
      <div class="dlg__body">
        <p class="dlg__msg" id="htMsg">The toad has stopped hopping.</p>
        <div class="dlg__scores">
          <div><span>Score</span><b id="htScore">0</b></div>
          <div><span>Best</span><b id="htBest">0</b></div>
        </div>
        <p class="dlg__new" id="htNew" hidden>★ New personal best ★</p>
        <div class="dlg__row">
          <button class="xpb xpb--go" id="htRetry" type="button">Play Again</button>
          <button class="xpb" id="htMenuBtn" type="button">Main Menu</button>
        </div>
        <p class="dlg__hint dlg__hint--sm">or press <kbd>SPACE</kbd></p>
      </div>
    </div>

    <!-- ─────────── loading ─────────── -->
    <div class="ht__load" id="htLoad"><span>Loading sprites…</span></div>

    <!-- ─────────── sound toggle ─────────── -->
    <button class="ht__snd" id="htSnd" type="button" aria-label="Toggle sound">🔊</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
